<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bulk Link Redirection Report</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 30px 40px; background: #f8fafc; margin: 0; color: #334155; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 20px 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .header-bar h2 { margin: 0; font-size: 22px; color: #0f172a; }
        
        .export-btn { background: #3b82f6; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .export-btn:hover { background: #2563eb; }

        .table-container { background: #fff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 20px; border-bottom: 1px solid #f1f5f9; font-size: 14px; word-break: break-all; }
        th { background: #f8fafc; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; border-bottom: 2px solid #e2e8f0; }
        
        tr:hover { background: #f8fafc; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; color: white; }
        .bg-green { background-color: #22c55e; }
        .bg-red { background-color: #ef4444; }
        .bg-purple { background-color: #a855f7; }
        .bg-gray { background-color: #94a3b8; }
        
        a { color: #3b82f6; text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }

        /* Pagination CSS */
        .pagination-footer { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: #fff; border-top: 1px solid #e2e8f0; border-radius: 0 0 8px 8px; }
        .items-per-page { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #475569; }
        .items-per-page select { padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; color: #0f172a; cursor: pointer; outline: none; }
        
        .page-numbers { display: flex; gap: 4px; align-items: center; }
        .page-btn { background: #fff; border: 1px solid #cbd5e1; padding: 6px 10px; border-radius: 4px; cursor: pointer; color: #3b82f6; font-size: 13px; transition: 0.2s; min-width: 32px; text-align: center; }
        .page-btn:hover:not(:disabled) { border-color: #3b82f6; background: #f0f9ff; }
        .page-btn.active { background: #1e62a0; color: #fff; border-color: #1e62a0; font-weight: bold; cursor: default; }
        .page-btn:disabled { color: #cbd5e1; cursor: not-allowed; border-color: #e2e8f0; }
        .ellipsis { color: #94a3b8; padding: 0 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>🔗 Advanced Link Status Report</h2>
        <button id="export-csv" class="export-btn">📥 Export to CSV</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">#</th>
                    <th style="width: 30%;">Original URL</th>
                    <th style="width: 10%;">Redirect</th>
                    <th style="width: 30%;">Final Destination</th>
                    <th style="width: 15%;">Final Status</th>
                    <th style="width: 10%; text-align:center;">Revisit</th>
                </tr>
            </thead>
            <tbody id="results-body">
                <tr><td colspan="5" style="text-align:center; padding: 30px; color: #94a3b8;">Loading Results...</td></tr>
            </tbody>
        </table>

        <div class="pagination-footer" id="pagination-wrapper" style="display: none;">
            <div class="items-per-page">
                Show 
                <select id="limit-select">
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="all">All</option>
                </select>
                items
            </div>
            <div class="page-numbers" id="page-numbers-container">
                </div>
        </div>
    </div>

    <script src="bulk_url_checker.js"></script>
</body>
</html>
